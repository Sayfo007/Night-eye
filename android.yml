name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Create Capacitor project
        run: |
          mkdir www
          cp index.html manifest.webmanifest sw.js www/
          cp -r icons www/icons
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          python3 - <<'PY'
          import json
          cfg = {
            "appId": "com.nighteye.cctv",
            "appName": "NightEye",
            "webDir": "www",
            "server": {"androidScheme": "https"}
          }
          json.dump(cfg, open("capacitor.config.json", "w"), indent=2)
          PY
          npx cap add android

      - name: Add camera and microphone permissions
        run: |
          python3 - <<'PY'
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p).read()
          extra = (
            '    <uses-permission android:name="android.permission.CAMERA" />\n'
            '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
            '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'
            '    <uses-feature android:name="android.hardware.camera" android:required="false" />\n'
          )
          s = s.replace("</manifest>", extra + "</manifest>")
          open(p, "w").write(s)
          PY

      - name: Set app icon
        continue-on-error: true
        run: |
          pip install pillow --break-system-packages
          python3 - <<'PY'
          import os, shutil
          from PIL import Image
          res = "android/app/src/main/res"
          shutil.rmtree(res + "/mipmap-anydpi-v26", ignore_errors=True)
          src = Image.open("icons/icon-512.png").convert("RGBA")
          sizes = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          for d, px in sizes.items():
              folder = f"{res}/mipmap-{d}"
              os.makedirs(folder, exist_ok=True)
              img = src.resize((px, px), Image.LANCZOS)
              for name in ("ic_launcher.png", "ic_launcher_round.png", "ic_launcher_foreground.png"):
                  img.save(f"{folder}/{name}")
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk NightEye.apk
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest NightEye.apk --repo "${{ github.repository }}" --title "NightEye APK" --notes "Install NightEye.apk on your Android phone." --latest
